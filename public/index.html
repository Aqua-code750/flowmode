<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlowMode - Simplify Your Routine</title>
    <style media="screen">
      body { background: #F2F2F7; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
      #message { background: white; max-width: 500px; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; border: 1px solid rgba(0,122,255,0.1); }
      h1 { color: #007AFF; margin-bottom: 8px; font-size: 32px; }
      p { color: #8E8E93; font-size: 18px; line-height: 1.5; margin-bottom: 32px; }
      .btn { background: #007AFF; color: white; padding: 16px 32px; border-radius: 12px; text-decoration: none; font-weight: bold; display: inline-block; transition: transform 0.2s; }
      .btn:hover { transform: scale(1.05); }
      .badge { display: inline-block; background: rgba(52, 199, 89, 0.1); color: #34C759; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="message">
      <div class="badge">n8n Style Edition</div>
      <h1>FlowMode</h1>
      <p>Your automated routine, simplified. Connect triggers and actions in a beautiful, visual workspace.</p>
      <a href="app-debug.apk" class="btn">Download App (v1.0)</a>
    </div>
  </body>
</html>
